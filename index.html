<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>발표자 뽑기</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f0f2ff; color: #202440; font-family: system-ui, sans-serif; }
    main { width: min(100%, 560px); padding: 32px; border-radius: 24px; background: white; box-shadow: 0 16px 50px #353a7015; }
    h1 { margin: 0 0 12px; font-size: 30px; }
    p { line-height: 1.6; color: #606680; }
    label { display: block; margin-bottom: 10px; font-weight: 650; }
    textarea { width: 100%; min-height: 160px; padding: 16px; resize: vertical; border: 1px solid #bfc5dc; border-radius: 12px; font: inherit; line-height: 1.6; }
    button { border: 0; padding: 15px 20px; border-radius: 12px; cursor: pointer; font: inherit; font-weight: 700; }
    button:focus-visible, textarea:focus-visible { outline: 3px solid #9986ff; outline-offset: 3px; }
    .buttons { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    #draw { flex: 1; background: #5943d6; color: white; }
    #reset { background: #eef0f7; color: #383e58; }
    .result { margin-top: 24px; padding: 24px; text-align: center; border-radius: 16px; background: #f5f3ff; overflow-wrap: anywhere; }
    #winner { display: block; margin-top: 8px; font-size: 36px; font-weight: 800; color: #5943d6; }
    #status { margin-bottom: 0; }
    ol { padding-left: 26px; line-height: 1.9; overflow-wrap: anywhere; }
    .hint { font-size: 14px; }
    @media (max-width: 420px) { main { padding: 24px; } h1 { font-size: 26px; } }
  </style>
</head>
<body>
  <main>
    <h1>🎤 발표자 뽑기</h1>
    <p>오늘의 발표자는 누구일까요?<br>한 번 뽑힌 사람은 다음 추첨에서 제외됩니다.</p>
    <label for="names">참가자 이름</label>
    <textarea id="names" placeholder="이름을 한 줄에 한 명씩 입력하세요.&#10;김민수&#10;이서연&#10;박지우" spellcheck="false"></textarea>
    <p class="hint">쉼표로 구분해도 됩니다. 같은 이름은 한 명으로 처리하므로 동명이인은 ‘김민수 A’, ‘김민수 B’로 구분하세요. 명단을 바꾸면 추첨 기록이 초기화됩니다.</p>
    <div class="buttons">
      <button id="draw" type="button">발표자 뽑기</button>
      <button id="reset" type="button">추첨 초기화</button>
    </div>
    <div class="result" role="status" aria-live="polite" aria-atomic="true">
      <span>선정된 발표자</span>
      <strong id="winner">아직 없어요</strong>
      <p id="status">명단을 입력하고 뽑기 버튼을 눌러 주세요.</p>
    </div>
    <h2>발표 순서</h2>
    <ol id="history"></ol>
    <p class="hint">명단은 서버로 전송하지 않습니다. 새로고침하면 명단과 기록이 사라집니다.</p>
  </main>
  <script>
    const namesInput = document.getElementById('names');
    const winner = document.getElementById('winner');
    const status = document.getElementById('status');
    const history = document.getElementById('history');
    let selected = [];

    function getNames() {
      return [...new Set(namesInput.value.split(/[\n,]+/).map(name => name.trim()).filter(Boolean))];
    }

    function resetDraw() {
      selected = [];
      history.replaceChildren();
      winner.textContent = '아직 없어요';
      const count = getNames().length;
      status.textContent = count ? `총 ${count}명 · 뽑기 버튼을 눌러 주세요.` : '참가자 이름을 입력해 주세요.';
    }

    // 나머지 연산의 편향을 피하는 무작위 인덱스 생성
    function randomIndex(length) {
      const limit = 4294967296 - (4294967296 % length);
      const buffer = new Uint32Array(1);
      do { crypto.getRandomValues(buffer); } while (buffer[0] >= limit);
      return buffer[0] % length;
    }

    document.getElementById('draw').addEventListener('click', () => {
      const names = getNames();
      if (!names.length) {
        status.textContent = '먼저 참가자 이름을 입력해 주세요.';
        namesInput.focus();
        return;
      }
      const remaining = names.filter(name => !selected.includes(name));
      if (!remaining.length) {
        status.textContent = '모두 발표자로 선정되었습니다. 다시 뽑으려면 추첨 초기화를 눌러 주세요.';
        return;
      }
      const chosen = remaining[randomIndex(remaining.length)];
      selected.push(chosen);
      winner.textContent = chosen;
      status.textContent = `총 ${names.length}명 중 ${selected.length}명 선정 · 남은 인원 ${remaining.length - 1}명`;
      const item = document.createElement('li');
      item.textContent = chosen;
      history.appendChild(item);
    });

    namesInput.addEventListener('input', resetDraw);
    document.getElementById('reset').addEventListener('click', resetDraw);
  </script>
</body>
</html>
